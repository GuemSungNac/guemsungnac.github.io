<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금성나씨 계보도 25세</title>
<script>
(function(){ let v='dark';
  try{ if(localStorage.getItem('계보도25밝기')==='light') v='light'; }catch(e){}
  document.documentElement.dataset.theme=v; })();
</script>
<style>
/* 빛깔은 플립북 틀(index.html)을 따른다 — 강안개 바탕 · 먹 · 관인 붉은빛 */
:root{
  --paper:#EEF0EE; --sheet:#F7F8F6; --ink:#14191C; --dim:#4E585D; --faint:#8E979B;
  --edge:#D5DAD8; --seal:#A33A2E; --river:#3E6B6E; --oldbg:#E7EAE6;
  --shadow:0 2px 6px rgba(31,38,42,.10),0 18px 48px rgba(31,38,42,.16);
}
:root[data-theme="dark"]{
  --paper:#12171A; --sheet:#171D21; --ink:#F0F4F2; --dim:#B4BFC1; --faint:#8A9497;
  --edge:#2A3338; --seal:#D9695B; --river:#6FA9A6; --oldbg:#1D2529;
  --shadow:0 2px 6px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:"Noto Serif KR","맑은 고딕","Malgun Gothic",serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.3;cursor:default}

/* 머리줄 */
.bar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:6px;
  padding:0 18px;z-index:5;background:var(--paper)}
.title{font-size:20px;font-weight:600;letter-spacing:.04em;margin-right:14px;white-space:nowrap}
.title small{font-size:15px;color:var(--dim);font-weight:400;margin-left:8px}
.gwon{display:flex;gap:2px}
.gwon button{height:36px;padding:0 14px;border-radius:18px;font-size:16px;color:var(--dim)}
.gwon button:hover{background:var(--oldbg);color:var(--ink)}
.gwon button.on{background:var(--seal);color:#fff}
.sp{flex:1}
.iconbtn{height:40px;min-width:40px;padding:0 10px;border-radius:20px;font-size:18px;color:var(--dim)}
.iconbtn:hover{background:var(--oldbg);color:var(--ink)}
#뒤로{color:var(--seal);font-size:16px}
.progress{position:fixed;top:56px;left:18px;right:18px;height:2px;background:var(--edge);border-radius:2px;z-index:5}
.progress i{display:block;height:100%;width:0;background:var(--seal);transition:width .25s ease}

/* 무대 */
/* ★확대는 쪽 그림만 — 무대가 스크롤 상자, 머리줄·아랫줄은 붙박이 (2026-09-19 사이트 폰 동작 분석) */
.stage{position:fixed;top:66px;bottom:62px;left:0;right:0;overflow:auto;perspective:2400px}
#판{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center;padding:8px 70px}
.stage.확대{cursor:grab} .stage.확대.끄는중{cursor:grabbing}
.stage.확대 .edge{display:none}
.배율{font-size:15px;color:var(--dim);min-width:52px;text-align:center}
.edge{position:absolute;top:0;bottom:0;width:calc(50% - 40px);cursor:pointer;z-index:1}
.edge.l{left:0} .edge.r{right:0}
.edge:hover::after{content:attr(data-글);position:absolute;top:50%;transform:translateY(-50%);
  font-size:64px;color:var(--faint);opacity:.55}
.edge.l:hover::after{right:calc(var(--반폭) + 24px)} .edge.r:hover::after{left:calc(var(--반폭) + 24px)}
.sheet{position:relative;z-index:2;background:#fff;box-shadow:var(--shadow);
  transform-origin:left center;will-change:transform}
.sheet img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.sheet.넘김앞{animation:넘앞 .32s ease-in forwards}
.sheet.넘김뒤{animation:넘뒤 .32s ease-in forwards}
.sheet.들어옴{animation:들어 .28s ease-out}
@keyframes 넘앞{to{transform:rotateY(-72deg) translateX(-6%);opacity:.15}}
@keyframes 넘뒤{from{transform-origin:right center}to{transform:rotateY(72deg) translateX(6%);opacity:.15}}
@keyframes 들어{from{opacity:.25;transform:scale(.985)}to{opacity:1;transform:none}}

/* 누를 곳 */
.표{position:absolute;border:2px solid rgba(214,160,0,.75);border-radius:4px;
  background:rgba(242,194,0,.12);cursor:pointer;z-index:3}
.표:hover{background:rgba(242,194,0,.40);border-color:#d6a000}
.표.卷{border-color:rgba(0,140,220,.8);background:rgba(0,170,255,.13)}
.표.卷:hover{background:rgba(0,170,255,.40)}
.표.깜{animation:깜 1.1s ease-out 3}
@keyframes 깜{0%{box-shadow:0 0 0 0 rgba(163,58,46,.95);background:rgba(163,58,46,.55)}
  100%{box-shadow:0 0 0 22px rgba(163,58,46,0)}}

/* 아랫줄 */
.foot{position:fixed;bottom:0;left:0;right:0;height:62px;display:flex;align-items:center;
  justify-content:center;gap:22px;z-index:5}
.pagebtn{width:52px;height:44px;border-radius:22px;font-size:30px;line-height:1;color:var(--dim)}
.pagebtn:hover:not(:disabled){background:var(--oldbg);color:var(--ink)}
.pageno{font-size:18px;color:var(--dim);min-width:170px;text-align:center}
.pageno b{color:var(--ink);font-size:21px}
.pageno input{width:74px;font:inherit;font-size:20px;font-weight:700;text-align:center;
  color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--faint)}
.hint{position:fixed;bottom:20px;right:22px;font-size:14px;color:var(--faint)}

/* 말풍선 · 차례 */
#말{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);padding:5px 10px;
  border-radius:6px;font-size:15px;display:none;z-index:9;white-space:nowrap}
.toc{position:fixed;top:0;right:0;bottom:0;width:340px;background:var(--sheet);z-index:8;
  box-shadow:var(--shadow);border-left:2px solid var(--seal);padding:22px 22px;overflow:auto;
  transform:translateX(105%);transition:transform .25s ease}
.toc.열림{transform:none}
.toc h3{margin:18px 0 8px;font-size:16px;color:var(--seal);letter-spacing:.06em}
.toc button.줄{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:17px}
.toc button.줄:hover{background:var(--oldbg)}
.toc button.줄 small{color:var(--faint);margin-left:8px;font-size:14px}
.toc .닫{position:absolute;top:14px;right:14px}
.toc .빈{color:var(--faint);font-size:15px;padding:6px 12px}
@media (max-width:640px){
  .bar{padding:0 10px;height:50px} .title{font-size:17px;margin-right:4px} .title small{display:none}
  .progress{top:50px;left:10px;right:10px} .stage{top:56px;bottom:56px}
  #판{padding:4px 2px} .edge{display:none}
  .foot{gap:2px;height:56px} .pagebtn{width:36px;height:40px;font-size:24px}
  .pageno{min-width:96px;font-size:15px} .pageno input{width:44px;font-size:18px}
  .배율{min-width:44px;font-size:13px} .hint{display:none}
  .foot span[style]{display:none}
}
</style>
</head>

<script>
const 자료 = {};
const 쪽수 = {1: 72};       // 권별 마지막 파일 번호
const 원W = 1400, 원H = 1736;
const 종이름 = ['見下', '見上', '卷'];
let 권 = 1, 쪽 = 1, 자취 = [], 다녀옴 = [], 넘기는중 = false;
const $ = id => document.getElementById(id);

for (let v = 1; v <= 1; v++) {
  const b = document.createElement('button'); b.textContent = v + '권'; b.dataset.v = v;
  b.style.display = 'none';
  $('권줄').appendChild(b);
  const c = document.createElement('button'); c.className = '줄';
  c.innerHTML = '계보도<small>' + 쪽수[v] + '쪽 · 0쪽 = 안내</small>';
  c.onclick = () => { 자취.push([권, 쪽]); 가기(v, 1); 차례(false); };
  $('차례권').appendChild(c);
}
function 파일(v, p) { return (p < 25 ? '1' : p < 50 ? '2' : '3') + '/gyebodo25/' + String(p).padStart(4, '0') + '.webp'; }   /* 깃허브에 25장씩 1·2·3 폴더로 올라감 (10-01) */

let 배율 = 1;          // 1 = 쪽 맞춤. ★쪽을 넘겨도 그대로 둔다(사이트 폰 동작)
try { 배율 = Math.max(1, Math.min(6, +localStorage.getItem('계보도25배율') || 1)); } catch (e) {}
function 크기() {
  const 무 = $('무대');
  const 기본 = Math.min((무.clientHeight - 16) / 원H, (무.clientWidth - (무.clientWidth < 640 ? 8 : 140)) / 원W);
  const 배 = 기본 * 배율;
  const w = Math.round(원W * 배), h = Math.round(원H * 배);
  $('쪽').style.width = w + 'px'; $('쪽').style.height = h + 'px';
  document.documentElement.style.setProperty('--반폭', Math.round(Math.min(w, 무.clientWidth) / 2) + 'px');
  무.classList.toggle('확대', 배율 > 1.001);
  $('배율표').textContent = Math.round(배율 * 100) + '%';
}
// 새 배율로 — (cx,cy)=무대 안 자리, 그 자리 아래 글자가 그대로 손가락·마우스 밑에 남게
function 확대(새, cx, cy) {
  const 무 = $('무대'), 쪽판 = $('쪽');
  if (cx == null) { cx = 무.clientWidth / 2; cy = 무.clientHeight / 2; }
  const m = 무.getBoundingClientRect(), r = 쪽판.getBoundingClientRect();
  const fx = (m.left + cx - r.left) / r.width, fy = (m.top + cy - r.top) / r.height;
  배율 = Math.max(1, Math.min(6, 새));
  크기();
  const r2 = 쪽판.getBoundingClientRect();
  무.scrollLeft += (r2.left + fx * r2.width) - (m.left + cx);
  무.scrollTop += (r2.top + fy * r2.height) - (m.top + cy);
  try { localStorage.setItem('계보도25배율', 배율); } catch (e) {}
}

function 그리기(v, p, 표시자리) {
  권 = v; 쪽 = p;
  $('그림').src = 파일(v, p);
  // 앞뒤 쪽 미리 불러 두기 (넘길 때 빈 종이가 안 보이게)
  [p - 1, p + 1].forEach(q => { if (q >= 0 && q <= 쪽수[v]) { const i = new Image(); i.src = 파일(v, q); } });
