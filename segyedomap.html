const wrap = document.getElementById('wrap');
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const S = 1; let OX = 0, OY = 0, sel = null, hits = [], hi = 0, onlyq = false;
document.getElementById('t').textContent = '지장록 갑진(1964)본 21세 세계도';
document.getElementById('stat').textContent = D.nodes.length + '명 · 1~' + D.MAXG + '世';

function resize(){ cv.width = wrap.clientWidth - 15; cv.height = wrap.clientHeight - 15; 막대크기(); draw(); 막대맞춤(); }
function fit(){
  OX = 0; OY = 0; 막대크기(); draw(); 막대맞춤();

function 처음(){                 // 1세 시조를 화면 가운데 위에
  let a = D.nodes[0];
  for (const n of D.nodes) if (n.g < a.g) a = n;
  OX = cv.width / 2 - (a.x + D.BW / 2);
  OY = 0;
  막기(); 막대크기(); draw(); 막대맞춤();
}
function world(e){ return [(e.offsetX - OX) / S, (e.offsetY - OY) / S]; }

function draw(){
  ctx.save();
  ctx.fillStyle = '#f4f1ea'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.translate(OX, OY); ctx.scale(S, S);
  ctx.fillStyle = '#ece6d8';
  for (let g = 1; g <= D.MAXG; g += 2){
    const y = D.PAD + (g - 1) * (D.BH + D.VG);
    ctx.fillRect(-1e6, y - 8, 3e6, D.BH + 60);    // 줄무늬 = 그 世의 칸+옆글
  }
  ctx.strokeStyle = '#b3aa93'; ctx.lineWidth = 2; ctx.beginPath();
  for (const e of D.edges){
    const my = (e[1] + e[3]) / 2;
    ctx.moveTo(e[0], e[1]); ctx.lineTo(e[0], my); ctx.lineTo(e[2], my); ctx.lineTo(e[2], e[3]);
  }
  ctx.stroke();
  ctx.textAlign = 'center';
  for (const n of D.nodes){
    const on = !onlyq || n.q;
    ctx.globalAlpha = on ? 1 : 0.15;
    ctx.fillStyle = (sel && sel.id === n.id) ? '#fff4c9' : (n.q ? '#fdeaea' : '#ffffff');

    ctx.strokeStyle = (sel && sel.id === n.id) ? '#c69a2b' : '#8d8674';
    ctx.lineWidth = (sel && sel.id === n.id) ? 4 : 1.4;
    ctx.strokeRect(n.x, n.y, D.BW, D.BH);

      ctx.textAlign = 'center';
      ctx.font = '700 22px serif';                        // 네모 안 위 = 한자 이름

      ctx.font = '700 17px "맑은 고딕","Malgun Gothic",sans-serif';   // 그 아래 = 한글이름
      if (n.k) ctx.fillText(n.k, n.x + D.BW / 2, n.y + 48);
      // 네모 옆 : 관직(한글) · 그 밑에 파 · 호
      ctx.textAlign = 'left';
      const 옆 = [];
      if (n.o) 옆.push(n.o + (n.ok ? '(' + n.ok + ')' : ''));
      if (n.p) 옆.push(n.p);
      if (n.h) 옆.push(n.h);
      let y = n.y + 22;
      for (const v of 옆){
        if (y > n.y + D.BH + 56) break;     // 다음 世 줄을 넘지 않는다
        ctx.fillText(v, n.x + D.BW + 8, y);

  ctx.restore();
  눈금그리기();
}
function 눈금그리기(){            // ★世는 왼쪽 붙박이 — 상하로만 움직인다
  const w = 64;
  ctx.save();
  ctx.fillStyle = '#efe9db'; ctx.fillRect(0, 0, w, cv.height);
  ctx.strokeStyle = '#d5cdb8'; ctx.lineWidth = 1;

  for (let g = 1; g <= D.MAXG; g++){

}
function hitTest(wx, wy){
  for (const n of D.nodes)
    if (wx >= n.x && wx <= n.x + D.BW && wy >= n.y && wy <= n.y + D.BH) return n;
  return null;
}

  const out = []; let c = n;
  while (c && c.f){ c = D.nodes.find(z => z.id === c.f); if (c) out.unshift(c); }
  return out;
}
function esc(s){ return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function show(n){
  sel = n;
  const s = document.getElementById('side');
  const anc = 조상(n).map(a => '<span data-id="' + a.id + '">' + esc(a.n) + '</span>').join(' → ');

  if (n.h) h += '<dt>字·號</dt><dd>' + esc(n.h) + '</dd>';
  if (n.p) h += '<dt>派</dt><dd>' + esc(n.p) + '</dd>';
  if (anc) h += '<dt>위로</dt><dd class="path">' + anc + '</dd>';
  if (kids) h += '<dt>아들</dt><dd class="path">' + kids + '</dd>';
  h += '</dl>';
  document.getElementById('body').innerHTML = h;
  s.style.display = 'block'; draw();
  s.querySelectorAll('[data-id]').forEach(el => el.onclick = () => {

  });
}

let dragging = false, px = 0, py = 0;

  e.preventDefault();

}, { passive: false });

function 막기(){                          // ★1세 위·판 왼쪽 밖은 안 보인다
  OX = Math.min(0, Math.max(cv.width - D.W, OX));

}
const hbar=document.getElementById('hbar'), vbar=document.getElementById('vbar');
const hin=document.getElementById('hin'), vin=document.getElementById('vin');
let 막대손대는중=false;
function 막대크기(){
  hin.style.width  = Math.round(D.W) + 'px';

}
function 막대맞춤(){                       // 그림 → 막대

}
hbar.addEventListener('scroll', ()=>{ if(막대손대는중) return; OX = -hbar.scrollLeft; draw(); });
vbar.addEventListener('scroll', ()=>{ if(막대손대는중) return; OY = -vbar.scrollTop; draw(); });

document.getElementById('close').onclick = () => { document.getElementById('side').style.display = 'none'; sel = null; draw(); };
document.getElementById('fit').onclick = fit;
document.getElementById('home').onclick = 처음;
document.getElementById('onlyq').onchange = e => { onlyq = e.target.checked; draw(); };

const q = document.getElementById('q');
function 표시(){ document.getElementById('hits').textContent = hits.length ? (hi + 1) + '/' + hits.length : (q.value ? '없음' : ''); }
q.oninput = () => {
  const v = q.value.trim();
  hits = v ? D.nodes.filter(n => (n.n && n.n.indexOf(v) >= 0) || (n.k && n.k.indexOf(v) >= 0)) : [];
  hi = 0; 표시();
  if (hits.length){ center(hits[0]); show(hits[0]); } else draw();
};

resize(); 처음();
